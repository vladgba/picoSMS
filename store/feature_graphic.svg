<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12A891"/><stop offset="1" stop-color="#0A5F7A"/>
    </linearGradient>
    <clipPath id="screen"><rect x="0" y="0" width="236" height="470" rx="26"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#04252B" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- faint oversized bubble -->
  <g opacity="0.07" fill="#fff" transform="translate(470 -40) scale(5.2)">
    <path d="M43,33L65,33A13,13 0,0 1,78 46L78,57A13,13 0,0 1,65 70L50,70L37,79.5L39.5,69.4A13,13 0,0 1,30 57L30,46A13,13 0,0 1,43 33Z"/>
  </g>

  <!-- brand -->
  <g transform="translate(72 98)">
    <rect width="76" height="76" rx="20" fill="#fff" fill-opacity="0.14"/>
    <g transform="translate(-16.5 -18) scale(1.02)">
      <path fill="#fff" d="M43,33L65,33A13,13 0,0 1,78 46L78,57A13,13 0,0 1,65 70L50,70L37,79.5L39.5,69.4A13,13 0,0 1,30 57L30,46A13,13 0,0 1,43 33Z"/>
      <circle cx="54" cy="51.5" r="7" fill="#0F9D8A"/>
    </g>
  </g>
  <text x="68" y="262" font-family="Inter Display" font-weight="800" font-size="88" fill="#fff" letter-spacing="-2">picoSMS</text>
  <text x="72" y="312" font-family="Inter" font-weight="500" font-size="30" fill="#E3FBF6">Tiny. Private. Just SMS.</text>

  <g font-family="Inter" font-weight="600" font-size="19" fill="#fff">
    <g transform="translate(72 352)">
      <rect width="130" height="40" rx="20" fill="#fff" fill-opacity="0.16"/>
      <text x="65" y="26.5" text-anchor="middle">~120 KB</text>
    </g>
    <g transform="translate(214 352)">
      <rect width="148" height="40" rx="20" fill="#fff" fill-opacity="0.16"/>
      <text x="74" y="26.5" text-anchor="middle">No internet</text>
    </g>
    <g transform="translate(374 352)">
      <rect width="190" height="40" rx="20" fill="#fff" fill-opacity="0.16"/>
      <text x="95" y="26.5" text-anchor="middle">White/black lists</text>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(700 46) rotate(-6)" filter="url(#sh)">
    <rect x="-10" y="-10" width="256" height="490" rx="36" fill="#0E1114"/>
    <g clip-path="url(#screen)">
      <rect width="236" height="470" fill="#F6F7F9"/>
      <text x="18" y="52" font-family="Inter Display" font-weight="800" font-size="22" fill="#111418">picoSMS</text>
      <!-- rows -->
      <g font-family="Inter">
        <g transform="translate(0 74)">
          <circle cx="36" cy="26" r="18" fill="#3F7DD8"/><text x="36" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">A</text>
          <text x="64" y="22" font-size="14" font-weight="700" fill="#111418">Anna</text>
          <text x="64" y="40" font-size="12" fill="#111418">See you at 7?</text>
          <rect x="196" y="28" width="20" height="18" rx="9" fill="#0F9D8A"/><text x="206" y="41" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
          <text x="216" y="20" text-anchor="end" font-size="10" fill="#0F9D8A">12:41</text>
        </g>
        <g transform="translate(0 132)">
          <circle cx="36" cy="26" r="18" fill="#D9653B"/><text x="36" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">M</text>
          <text x="64" y="22" font-size="14" fill="#111418">Mom</text>
          <text x="64" y="40" font-size="12" fill="#5B6470">You: Call you tonight</text>
          <text x="216" y="20" text-anchor="end" font-size="10" fill="#5B6470">11:02</text>
        </g>
        <g transform="translate(0 190)">
          <circle cx="36" cy="26" r="18" fill="#0F9D8A"/><text x="36" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">#</text>
          <text x="64" y="22" font-size="13" fill="#111418">+359 88 123 456</text>
          <text x="64" y="40" font-size="12" fill="#5B6470">Your code is 4821</text>
          <text x="216" y="20" text-anchor="end" font-size="10" fill="#5B6470">09:15</text>
        </g>
        <g transform="translate(0 248)">
          <circle cx="36" cy="26" r="18" fill="#8E5BD6"/><text x="36" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">D</text>
          <text x="64" y="22" font-size="14" fill="#111418">Dimitar</text>
          <text x="64" y="40" font-size="12" fill="#5B6470">Parcel is at the office</text>
          <text x="216" y="20" text-anchor="end" font-size="10" fill="#5B6470">Oct 8</text>
        </g>
        <g transform="translate(0 306)">
          <circle cx="36" cy="26" r="18" fill="#3C9A4E"/><text x="36" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">B</text>
          <text x="64" y="22" font-size="14" fill="#111418">BANK</text>
          <text x="64" y="40" font-size="12" fill="#5B6470">Card payment 24.90 BGN</text>
          <text x="216" y="20" text-anchor="end" font-size="10" fill="#5B6470">Oct 7</text>
        </g>
      </g>
      <circle cx="196" cy="420" r="24" fill="#0F9D8A"/>
      <path transform="translate(184 408)" fill="#fff" d="M3,17.25V21h3.75L17.81,9.94l-3.75,-3.75L3,17.25zM20.71,7.04c0.39,-0.39 0.39,-1.02 0,-1.41l-2.34,-2.34c-0.39,-0.39 -1.02,-0.39 -1.41,0l-1.83,1.83 3.75,3.75 1.83,-1.83z"/>
    </g>
  </g>
</svg>
